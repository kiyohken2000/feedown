# Keyword highlight: an article whose title contains a notification keyword
# gets a chip with the keyword and a marker on the keyword in the title.
# Matching ignores full-width / half-width and case, so the keyword is entered
# in full width. Needs an article with "iPhone" in its title (the test account
# follows iPhone Mania). "iPhon" is used so it does not collide with an
# "iPhone" keyword already saved (keywords are de-duplicated after NFKC).
# Removes the keyword at the end.
appId: net.votepurchase.feedown
name: Keyword highlight in the article list
---
- runFlow: subflows/launch.yaml
- tapOn: "Settings, tab.*"
- tapOn: "Background Refresh.*"
- scrollUntilVisible:
    element:
      id: "bg-keyword-input"
    direction: DOWN
- assertVisible: ".*also highlighted in the article list.*"
- tapOn:
    id: "bg-keyword-input"
- inputText: "ｉＰｈｏｎ"
- tapOn:
    id: "bg-keyword-add"
- assertVisible:
    id: "bg-keyword-ｉＰｈｏｎ"

# The chip shows the first matching keyword, in NFKC
- tapOn: "Articles, tab.*"
- extendedWaitUntil:
    visible: ".*Matches keyword iPhon.*"
    timeout: 10000
- takeScreenshot: keyword_highlight

# Remove it again
- tapOn: "Settings, tab.*"
- scrollUntilVisible:
    element:
      id: "bg-keyword-ｉＰｈｏｎ"
    direction: DOWN
- tapOn:
    id: "bg-keyword-ｉＰｈｏｎ"
- assertNotVisible:
    id: "bg-keyword-ｉＰｈｏｎ"
- tapOn: "Articles, tab.*"
# Only checked when no other keyword is saved: others may still match
- runFlow:
    when:
      notVisible: ".*Matches keyword iPhone.*"
    commands:
      - assertNotVisible: ".*Matches keyword.*"
